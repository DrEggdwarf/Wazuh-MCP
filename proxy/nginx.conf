# Support websockets (certaines fonctions d'OpenSearch Dashboards)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/cert.crt;
    ssl_certificate_key /etc/nginx/cert.key;

    # Authz : valide la SESSION du dashboard Wazuh (single-login). Sans cookie de session
    # valide, le dashboard renvoie 401 -> nginx refuse /mcp-chat. Ferme l'accès anonyme au
    # chat MCP (sinon API/outils joignables sans login).
    location = /__authz {
        internal;
        proxy_pass https://wazuh.dashboard:5601/api/saved_objects/_find?type=index-pattern&per_page=1;
        proxy_ssl_verify off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header osd-xsrf "true";
    }

    # Chat léger SOC (UI + API), MÊME ORIGINE -> pas de mixed-content, pas de cert en plus.
    # Protégé par la session dashboard (auth_request) : le cookie est envoyé automatiquement
    # par les fetch du bouton MCP (page dashboard déjà authentifiée).
    location /mcp-chat/ {
        auth_request /__authz;
        proxy_pass http://mcp-chat:8001/;
        proxy_set_header Host $host;
    }

    # Script du bouton MCP (injecté dans le dashboard ci-dessous)
    location = /__mcp-fab.js {
        alias /srv/fab.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Dashboard Wazuh = page principale + INJECTION du bouton avant </body> (sub_filter)
    location / {
        proxy_pass https://wazuh.dashboard:5601;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";          # désactive gzip amont -> sub_filter voit le HTML
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # force le navigateur à toujours re-télécharger le HTML (sinon il garde une
        # version en cache SANS l'injection)
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        sub_filter '</body>' '<script src="/__mcp-fab.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
    }
}
