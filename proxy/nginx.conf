# Support websockets (certaines fonctions d'OpenSearch Dashboards)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/cert.crt;
    ssl_certificate_key /etc/nginx/cert.key;

    # Chat léger SOC (UI + API), MÊME ORIGINE -> pas de mixed-content, pas de cert en plus
    location /mcp-chat/ {
        proxy_pass http://mcp-chat:8001/;
        proxy_set_header Host $host;
    }

    # Script du bouton MCP (injecté dans le dashboard ci-dessous)
    location = /__mcp-fab.js {
        alias /srv/fab.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Dashboard Wazuh = page principale + INJECTION du bouton avant </body> (sub_filter)
    location / {
        proxy_pass https://wazuh.dashboard:5601;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";          # désactive gzip amont -> sub_filter voit le HTML
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # force le navigateur à toujours re-télécharger le HTML (sinon il garde une
        # version en cache SANS l'injection)
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        sub_filter '</body>' '<script src="/__mcp-fab.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
    }
}
