# Base SOC réutilisable : Wazuh (indexer+manager+dashboard) vierge + composant MCP (IA).
# Tout sur le même réseau Docker -> le MCP joint Wazuh par NOM DE SERVICE (indexeur jamais
# exposé). Déploiement :  docker compose up -d --build     (point d'entrée : https://localhost:8445)
#
# Noms de service POINTÉS (wazuh.indexer / wazuh.manager / wazuh.dashboard) : OBLIGATOIRE.
# Les certs démo bakés dans les images ont ces noms dans leurs SAN, et filebeat fait du
# mutual-TLS vers https://wazuh.indexer:9200. Renommer casserait DNS + vérif TLS.
#
# Creds lab (jetables, à changer en prod) : indexeur admin/admin ; API manager wazuh-wui/wazuh-wui.
services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.5
    platform: linux/amd64
    hostname: wazuh.indexer
    restart: always
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    # Auto-init de l'index de sécurité (.opendistro_security) au 1er boot : sans ce flag,
    # l'image n'amorce pas la conf sécurité et il faut lancer securityadmin.sh à la main.
    command: >
      bash -c "grep -q allow_default_init_securityindex /usr/share/wazuh-indexer/config/opensearch.yml || {
      echo '' >> /usr/share/wazuh-indexer/config/opensearch.yml;
      echo 'plugins.security.allow_default_init_securityindex: true' >> /usr/share/wazuh-indexer/config/opensearch.yml; };
      exec /entrypoint.sh opensearchwrapper"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.5      # image stock (base vierge réutilisable)
    platform: linux/amd64
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514/udp"     # agents
      - "1515:1515/tcp"
    environment:
      # Filebeat -> indexeur (mécanisme officiel par env, traité par 1-config-filebeat)
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - WAZUH_API_USER=wazuh-wui
      - WAZUH_API_PASSWORD=wazuh-wui
    healthcheck:
      # le manager a curl ; on valide directement son API (ce dont le MCP a besoin)
      test: ["CMD-SHELL","curl -sk -o /dev/null -w '%{http_code}' -u wazuh-wui:wazuh-wui -X POST https://localhost:55000/security/user/authenticate | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    depends_on:
      - wazuh.indexer
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-etc:/var/ossec/etc   # règles custom éventuelles : voir README

  wazuh.dashboard:
    build:
      context: ./dashboard
    image: soc-stack/wazuh-dashboard:4.14.5
    platform: linux/amd64
    hostname: wazuh.dashboard
    restart: always
    # accès via le reverse-proxy (service "proxy") -> https://localhost:8445
    expose:
      - "5601"
    environment:
      # conf connexion API Wazuh (mécanisme 4.14.5 : wazuh_app_config.sh)
      - WAZUH_API_URL=https://wazuh.manager
      - API_PORT=55000
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
      - RUN_AS=false
      # creds indexeur pour le dashboard (keystore)
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    depends_on:
      - wazuh.manager
      - wazuh.indexer

  mcp-server:
    build: ./mcp-server                  # build depuis les sources gbrigandi (auto-suffisant)
    image: soc-stack/mcp-server
    hostname: mcp-server
    restart: unless-stopped
    expose:
      - "8000"                           # interne uniquement (joint par le chat via mcp-server:8000)
    environment:
      # API manager (source principale des outils MCP)
      - WAZUH_HOST=wazuh.manager
      - WAZUH_PORT=55000
      - WAZUH_USER=wazuh-wui
      - WAZUH_PASS=wazuh-wui
      - WAZUH_API_HOST=wazuh.manager
      - WAZUH_API_PORT=55000
      - WAZUH_API_USERNAME=wazuh-wui
      - WAZUH_API_PASSWORD=wazuh-wui
      # Indexeur (recherche d'alertes) — https, admin/admin (creds démo)
      - WAZUH_INDEXER_HOST=wazuh.indexer
      - WAZUH_INDEXER_PORT=9200
      - WAZUH_INDEXER_USERNAME=admin
      - WAZUH_INDEXER_PASSWORD=admin
      - WAZUH_VERIFY_SSL=false
      - VERIFY_SSL=false
      - MCP_SERVER_PORT=8000
      - RUST_LOG=info
    depends_on:
      - wazuh.manager

  # --- Chat léger SOC : BYOK, sans compte, boucle outils MCP Wazuh + Anthropic ---
  mcp-chat:
    build: ./mcp-chat
    image: soc-stack/mcp-chat
    hostname: mcp-chat
    restart: unless-stopped
    environment:
      - MCP_URL=http://mcp-server:8000/mcp
      - DB_PATH=/data/soc.db
    expose:
      - "8001"
    volumes:
      - mcp-chat-data:/data        # historique conversations (SQLite)
    depends_on:
      - mcp-server

  # --- Reverse-proxy : 1 point d'entrée https (portail = dashboard + chat MCP inline) ---
  proxy:
    build: ./proxy
    image: soc-stack/proxy
    hostname: proxy
    restart: always
    ports:
      # POINT D'ENTRÉE UNIQUE. Hôte 8445 (8443 est déjà pris par le forward NAT VMware
      # vers l'OVA Wazuh -> conflit : le navigateur tombait sur l'OVA, sans injection).
      - "8445:8443"
    depends_on:
      - wazuh.dashboard
      - mcp-chat

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-manager-logs:
  wazuh-manager-etc:
  mcp-chat-data:
